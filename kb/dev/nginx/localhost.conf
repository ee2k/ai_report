# Copy this file to /etc/nginx/conf.d/intuit-mind.conf on Fedora.
# Deploy the repository contents (not the enclosing repository directory) to
# /var/www/intuit-mind before enabling Nginx.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /home/dev/Documents/repo/tech-base;
    index index.html;

    # GitHub Pages accepts extensionless page URLs.  Keep those URLs working
    # when the same files are served by Nginx.
    location / {
        try_files $uri $uri.html $uri/ =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # These language navigation URLs point to the demo landing pages.
    # location = /en {
    #     return 302 /en/demo;
    # }

    # location = /zh {
    #     return 302 /zh/demo;
    # }

    # Do not expose Git metadata or deployment-only files if they are copied
    # accidentally with the site.
    location ~ /(?:\.git|\.env|nginx)(?:/|$) {
        deny all;
    }

    # Static content can be cached; HTML stays fresh so redirects and content
    # changes are visible immediately after deployment.
    # location ~* \.(?:css|js|png|svg|ico|woff2?)$ {
    #     try_files $uri =404;
    #     expires 7d;
    #     add_header Cache-Control "public";
    # }

    # location ~* \.html$ {
    #     expires -1;
    #     add_header Cache-Control "no-cache";
    # }
}
